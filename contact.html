
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Contacter l'association FEDEZ IBIL.">
  <title>Nous contacter — FEDEZ IBIL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="contact.css">

  <script defer src="langue.js"></script>
  <script defer src="contact-config.js"></script>
  <script defer src="contact.js"></script>
</head>

<body class="contact-page" data-page="contact">

  <a class="info-home-link" href="index.html" aria-label="Retour à l'accueil">
    <span class="info-home-title">FEDEZ IBIL</span>
    <img
      src="images/bihotz-sakratua-xuria.svg"
      alt=""
      class="info-home-heart"
    >
  </a>

  <div class="language-switch" aria-label="Choix de la langue">
    <button class="lang-btn active" data-lang="fr" type="button" aria-label="français">
      <img src="images/blason-france.svg" alt="">
      <span class="lang-label" data-lang-label="fr">français</span>
    </button>

    <button class="lang-btn" data-lang="eu" type="button" aria-label="basque">
      <img src="images/blason-navarre.svg" alt="">
      <span class="lang-label" data-lang-label="eu">basque</span>
    </button>
  </div>

  <nav class="main-nav info-main-nav" aria-label="Navigation principale">
    <a class="nav-link" href="index.html" data-i18n="nav.home">Accueil</a>
    <a class="nav-link" href="informations.html" data-i18n="nav.info">Informations</a>
    <a class="nav-link" href="inscriptions.html" data-i18n="nav.signup">Inscriptions</a>
    <a class="nav-link" href="liens.html" data-i18n="nav.links">Liens</a>
  </nav>

  <main class="contact-main">
    <section class="contact-card" aria-labelledby="contact-title">

      <h1 id="contact-title" data-i18n="contact.title">
        Nous contacter
      </h1>

      <div class="ornament" aria-hidden="true">✦</div>

      <p class="contact-intro" data-i18n="contact.intro">
        Pour toute question concernant le pèlerinage FEDEZ IBIL,
        vous pouvez nous écrire au moyen de ce formulaire.
      </p>

      <form id="contact-form" method="post" target="contact-response">

        <input type="hidden" name="type" value="contact-fedez-ibil">
        <input type="hidden" id="contact-lang" name="langue" value="fr">

        <div class="contact-field">
          <label for="prenom" data-i18n="contact.first">Prénom *</label>
          <input id="prenom" name="prenom" autocomplete="given-name"
                 required maxlength="120">
        </div>

        <div class="contact-field">
          <label for="nom" data-i18n="contact.last">Nom *</label>
          <input id="nom" name="nom" autocomplete="family-name"
                 required maxlength="120">
        </div>

        <div class="contact-field">
          <label for="email" data-i18n="contact.email">
            Adresse électronique *
          </label>
          <input id="email" name="email" type="email"
                 autocomplete="email" required maxlength="254">
        </div>

        <div class="contact-field">
          <label for="objet" data-i18n="contact.subject">Objet *</label>
          <input id="objet" name="objet" type="text"
                 required maxlength="180">
        </div>

        <div class="contact-field">
          <label for="message" data-i18n="contact.message">
            Votre message *
          </label>
          <textarea id="message" name="message"
                    required maxlength="12000"></textarea>
        </div>

        <button id="contact-submit" class="contact-submit"
                type="submit" data-i18n="contact.send">
          Envoyer le message
        </button>

        <p class="contact-status" id="contact-status"
           role="status" aria-live="polite"></p>

      </form>

      <iframe name="contact-response" id="contact-response"
              title="Réponse du formulaire" hidden></iframe>

    </section>

    <p class="info-back-wrap">
      <a class="info-back-button" id="contact-back"
         href="index.html" data-i18n="info.back">
        ← Retour à l’accueil
      </a>
    </p>
  </main>

  <footer><span>FEDEZ IBIL</span></footer>

</body>
</html>
