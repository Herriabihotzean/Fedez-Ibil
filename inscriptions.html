<!doctype html>
<html lang="fr">
<head>

  <style>
    .signup-intro {

      margin: .7rem 0;
    }

    .signup-open-button {
      display: inline-block;
      margin-top: 1rem;
      padding: .85rem 1.35rem;
      border: 1px solid #17364c;
      border-radius: 999px;
      background: #17364c;
      color: #fff;
      font: 700 .95rem/1 "Libre Baskerville", Georgia, serif;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .signup-open-button:hover,
    .signup-open-button:focus-visible {
      transform: translateY(-1px);
      opacity: .9;
      color: #fff;
    }

<body data-page="signup" class="information-page">

  <a class="info-home-link" href="index.html" aria-label="Retour à l'accueil">
